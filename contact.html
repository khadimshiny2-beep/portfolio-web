    <main>
      <p class="eb">CONTACT</p>
      <h1>Écrivez-moi</h1>
      <div class="two">
        <form id="f" novalidate autocomplete="on">
          <div class="row">
            <label
              >Nom *<input
                name="nom"
                required
                maxlength="60"
                autocomplete="family-name"
            /></label>
            <label
              >Prénom *<input
                name="prenom"
                required
                maxlength="60"
                autocomplete="given-name"
            /></label>
          </div>
          <label
            >Adresse e-mail *<input
              name="email"
              type="email"
              required
              maxlength="120"
              autocomplete="email"
          /></label>
          <label
            >Sujet *<input
              name="sujet"
              required
              maxlength="100"
              placeholder="Demande de stage, collaboration..."
          /></label>
          <label
            >Message *<textarea
              name="message"
              required
              maxlength="1200"
              rows="7"
            ></textarea>
          </label>
          <button class="btn" type="submit">envoyer le message</button>
          <p id="msg" role="status"></p>
        </form>
        <ul class="links">
          <li><span>email</span><a id="mail" href="#">…</a></li>
          <li>
            <span>github</span
            ><a
              href="https://github.com/khadimshiny2-beep"
              target="_blank"
              rel="noopener noreferrer"
              >khadimshiny2-beep</a
            >
          </li>
          <li>
            <span>linkedin</span
            ><a
              href="https://www.linkedin.com/in/ahmadoul-khadim-gueye-b503743a6/"
              target="_blank"
              rel="noopener noreferrer"
              >ahmadoul-khadim-gueye</a
            >
          </li>
        </ul>
      </div>
    </main>
    <footer>No matter where you are, everyone is always connected.</footer>
  </body>
