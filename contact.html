<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Khadim Guèye</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <div id="welcome-banner">
    👋 Bienvenue sur mon portfolio ! Bonne visite.
    <button class="close-btn" id="close-banner">×</button>
  </div>

  <header>
    <img src="https://media.licdn.com/dms/image/v2/D4E0BAQH__4XkuSqRZA/company-logo_200_200/company-logo_200_200/0/1711714375397/campus_franco_sngalais_logo?e=2147483647&v=beta&t=eXFE8LnIj4N0o_kCzlevlXfT1Qt3oB-_aqcLISq0W1o" alt="Logo URDFS"/>
    <span class="site-name">Khadim Guèye · LDIA</span>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="apropos.html">À propos</a></li>
      <li><a href="competences.html">Compétences</a></li>
      <li><a href="projets.html">Mes projets</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <p class="titredepage">Contact</p>

    <form id="form-contact" novalidate>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label for="nom">Nom *</label>
          <input type="text" id="nom" name="nom" placeholder="Guèye" />
          <span class="field-error" id="err-nom"></span>
        </div>
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input type="text" id="prenom" name="prenom" placeholder="Khadim" />
          <span class="field-error" id="err-prenom"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail *</label>
        <input type="email" id="email" name="email" placeholder="khadim@example.com" />
        <span class="field-error" id="err-email"></span>
      </div>

      <div class="form-group">
        <label for="sujet">Sujet *</label>
        <input type="text" id="sujet" name="sujet" placeholder="Demande de stage, collaboration…" />
        <span class="field-error" id="err-sujet"></span>
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" placeholder="Votre message…"></textarea>
        <span class="field-error" id="err-message"></span>
      </div>

      <button type="submit" class="btn btn-primary">Envoyer le message</button>

      <!-- Retour après soumission (Fonction 3 JS) -->
      <div class="form-feedback" id="form-feedback"></div>

    </form>
  </main>

  <footer>
    © 2025 Ahmadoul Khadim Guèye · LDIA — Université Rose Dieng France Sénégal
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
